name: Agentic Software Factory - DoD Verification

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  verify-dod:
    name: "Definition of Done (DoD) Quality Gates"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Endurecimiento de Seguridad (StepSecurity)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: 3. Configurar Python y UV
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 4. Instalar UV y herramientas de auditoría
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 5. Detección de Marcadores Prohibidos (TODO / FIXME sin resolver)
        run: |
          echo "🔍 Auditando presencia de TODOs o FIXMEs pendientes..."
          if git grep -E "(TODO|FIXME):" -- 'specs/' 'src/' 'history/' 2>/dev/null; then
            echo "❌ ERROR: Se detectaron marcadores TODO/FIXME pendientes que violan el Definition of Done."
            exit 1
          else
            echo "✅ Cero marcadores pendientes encontrados."
          fi

      - name: 6. Verificación de Integridad de la Constitución
        run: |
          if [ ! -f ".specify/memory/constitution.md" ]; then
            echo "❌ ERROR: Falta el archivo .specify/memory/constitution.md requerido por la gobernanza."
            exit 1
          fi
          echo "✅ Constitución inmutable presente y verificada."

      - name: 7. Ejecutar Pruebas y Cobertura (si existen suites de prueba)
        run: |
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then
            uv venv
            . .venv/bin/activate
            [ -f "requirements.txt" ] && uv pip install -r requirements.txt || true
            if command -v pytest >/dev/null 2>&1; then
              pytest --cov=. --cov-fail-under=85
            fi
          elif [ -f "package.json" ]; then
            npm ci || npm install
            npm test --if-present
          else
            echo "ℹ️ Repositorio en fase de andamiaje / especificación inicial."
          fi

      - name: 8. Certificación Final de Estado READY
        run: echo "🎉 Todas las compuertas deterministas del Definition of Done han sido superadas con éxito."
